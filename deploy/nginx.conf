# nginx alternative (after getting a certificate, e.g. with certbot). The logs endpoint long-polls ~20s.
server {
    listen 443 ssl http2;
    server_name sniper.example.com;
    ssl_certificate     /etc/letsencrypt/live/sniper.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sniper.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
