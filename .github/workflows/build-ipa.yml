name: Build unsigned IPA

on:
  workflow_dispatch:          # Actions tab -> "Build unsigned IPA" -> Run workflow
  push:
    branches: [main]
    paths: ["ios/**", "web/**", ".github/workflows/build-ipa.yml"]
    tags: ["v*"]

permissions:
  contents: write             # only needed to attach the IPA to a release on tag pushes

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: ./ios/build-unsigned-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GunsSniper-unsigned-ipa
          path: ios/GunsSniper-unsigned.ipa
          if-no-files-found: error

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/GunsSniper-unsigned.ipa
